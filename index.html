<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nrchi watching</title>
    <style>
        /* 1. 基本フォント・ウェイト設定 */
        * {
            box-sizing: border-box;
            font-weight: 400 !important; 
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, "Yu Gothic Pr6N", "Yu Gothic", sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            line-height: 1.4;
            max-width: 170ch;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            body {
                max-width: none;
            }
        }

        /* 2. とらボタン */
        header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #logo {
            height: 40px;
            display: block;
        }
        .win95-btn {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 4px 10px;
            cursor: pointer;
            font-family: Arial;
            font-size: 12px;
            outline: none;
            user-select: none;
        }
        .win95-btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        /* 3. レイアウト */
        .log-entry {
            margin-bottom: 14px;
        }
        .timestamp {
            font-size: 11.2px;
            color: #0000ff;
            margin-bottom: 4px;
        }
        .content {
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .content a {
            color: #0000ff;
            text-decoration: underline;
        }

        /* 4. 画像レイアウト・レスポンシブ設定 */
        .photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px; 
            margin-top: 14px;
        }
        .photo-item {
            display: block;
        }
        .photo-item img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain; 
        }

        /* パターン1: 通常・正方形 (スマホ70%中央, PC25%横並び) */
        @media (max-width: 768px) {
            .photo-item.standard {
                width: 70%;
                margin: 0 auto;
            }
            .photo-item.wide {
                width: 100%;
            }
            .photo-item.tall img {
                max-height: 100vw;
            }
        }
        @media (min-width: 769px) {
            .photo-item.standard {
                width: calc(25% - 10.5px); 
            }
            .photo-item.wide {
                width: 100%;
            }
            .photo-item.tall {
                width: auto;
            }
            .photo-item.tall img {
                max-height: 100vw;
                width: auto;
            }
        }

        /* 区切り線 */
        .separator {
            border: none;
            border-top: 1px solid #cccccc;
            margin-bottom: 14px;
        }

        #loading {
            font-size: 14px;
            color: #888;
        }

        /* 5. さらに読み込むボタン */
        #load-more-container {
            text-align: left; 
            margin-top: 20px;
            margin-bottom: 40px;
            display: none; 
        }
        #load-more-btn {
            color: #0000ff;
            font-size: 14px;
            cursor: pointer;
        }
        #load-more-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.svg" id="logo" alt="logo">
    <button class="win95-btn" onclick="toggleLogo(this)">とらを表示</button>
</header>

<div id="log-container"></div>
<p id="loading">Loading logs...</p>

<div id="load-more-container">
    <span id="load-more-btn" onclick="renderNextPage()">さらに読み込む</span>
</div>

<script>
    // logs.json を読む（同じリポジトリ内）。キャッシュ回避に日時パラメータを付与
    const JSON_URL = "logs.json";
    const PER_PAGE = 30; // 1回に表示する件数

    let allLogs = [];      // 全データを保持
    let renderedCount = 0; // すでに表示した件数

    function toggleLogo(btn) {
        const logo = document.getElementById('logo');
        if (logo.getAttribute('src') === 'logo.svg') {
            logo.setAttribute('src', 'logo.tora.svg');
            btn.textContent = 'とらを非表示';
        } else {
            logo.setAttribute('src', 'logo.svg');
            btn.textContent = 'とらを表示';
        }
    }

    function linkify(text) {
        const urlPattern = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
    }
    
    function handleImageLoad(img) {
        const ratio = img.naturalWidth / img.naturalHeight;
        const parent = img.parentElement;

        if (ratio > 2.0) {
            parent.classList.add('wide'); 
        } else if (ratio < 0.5) {
            parent.classList.add('tall'); 
        } else {
            parent.classList.add('standard'); 
        }
    }

    // 1件分のログをDOMに描画
    function renderLog(log, container) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';

        const ts = document.createElement('div');
        ts.className = 'timestamp';
        ts.textContent = log.timestamp;
        entry.appendChild(ts);

        const content = document.createElement('div');
        content.className = 'content';
        content.innerHTML = linkify(log.content);
        entry.appendChild(content);

        if (log.photos && log.photos.length > 0) {
            const photoContainer = document.createElement('div');
            photoContainer.className = 'photo-container';
            
            log.photos.forEach(src => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = "";
                img.onerror = () => photoItem.remove();
                img.onload = () => handleImageLoad(img);
                
                photoItem.appendChild(img);
                photoContainer.appendChild(photoItem);
            });
            entry.appendChild(photoContainer);
        }

        container.appendChild(entry);

        const hr = document.createElement('hr');
        hr.className = 'separator';
        container.appendChild(hr);
    }

    // 次の30件を表示
    function renderNextPage() {
        const container = document.getElementById('log-container');
        const loadMoreContainer = document.getElementById('load-more-container');

        const next = allLogs.slice(renderedCount, renderedCount + PER_PAGE);
        next.forEach(log => renderLog(log, container));
        renderedCount += next.length;

        // まだ残りがあればボタン表示、なければ非表示
        if (renderedCount < allLogs.length) {
            loadMoreContainer.style.display = 'block';
        } else {
            loadMoreContainer.style.display = 'none';
        }
    }

    // 初回：logs.json を取得
    async function init() {
        const loading = document.getElementById('loading');
        try {
            // ?t=... を付けてブラウザキャッシュを回避（常に最新を取得）
            const response = await fetch(`${JSON_URL}?t=${Date.now()}`);
            const data = await response.json();

            loading.style.display = 'none';

            allLogs = data.logs || [];

            if (allLogs.length === 0) {
                document.getElementById('log-container').innerHTML = '<p>No logs found.</p>';
                return;
            }

            renderNextPage(); // 最初の30件を表示

        } catch (error) {
            console.error("Error fetching logs:", error);
            loading.innerHTML = '読み込みに失敗しました。<span style="color:#0000ff;cursor:pointer;margin-left:8px;" onclick="location.reload()">再試行</span>';
        }
    }

    init();
</script>

</body>
</html>
