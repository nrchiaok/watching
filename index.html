<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nrchi watching</title>
    <style>
        /* 1. 基本フォント・ウェイト設定 */
        * {
            box-sizing: border-box;
            font-weight: 400 !important; 
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, "Yu Gothic Pr6N", "Yu Gothic", sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            line-height: 1.4;
            max-width: 170ch;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            body {
                max-width: none;
            }
        }

        /* 2. とらボタン */
        header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #logo {
            height: 40px;
            display: block;
        }
        .win95-btn {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 4px 10px;
            cursor: pointer;
            font-family: Arial;
            font-size: 12px;
            outline: none;
            user-select: none;
        }
        .win95-btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        /* 3. レイアウト */
        .log-entry {
            margin-bottom: 14px;
            scroll-margin-top: 20px; /* スクロール移動時の上余白 */
        }
        .timestamp {
            font-size: 11.2px;
            color: #0000ff;
            margin-bottom: 4px;
        }
        .content {
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .content a {
            color: #0000ff;
            text-decoration: underline;
        }

        /* 4. 画像レイアウト・レスポンシブ設定 */
        .photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px; 
            margin-top: 14px;
        }
        .photo-item {
            display: block;
        }
        .photo-item img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain; 
        }

        /* パターン1: 通常・正方形 (スマホ70%中央, PC25%横並び) */
        @media (max-width: 768px) {
            .photo-item.standard {
                width: 70%;
                margin: 0 auto;
            }
            .photo-item.wide {
                width: 100%;
            }
            .photo-item.tall img {
                max-height: 100vw;
            }
        }
        @media (min-width: 769px) {
            .photo-item.standard {
                width: calc(25% - 10.5px); 
            }
            .photo-item.wide {
                width: 100%;
            }
            .photo-item.tall {
                width: auto;
            }
            .photo-item.tall img {
                max-height: 100vw;
                width: auto;
            }
        }

        /* 区切り線 */
        .separator {
            border: none;
            border-top: 1px solid #cccccc;
            margin-bottom: 14px;
        }

        #loading {
            font-size: 14px;
            color: #888;
        }

        /* 5. さらに読み込むボタン */
        #load-more-container {
            text-align: left; 
            margin-top: 20px;
            margin-bottom: 40px;
            display: none; 
        }
        #load-more-btn {
            color: #0000ff;
            font-size: 14px;
            cursor: pointer;
        }
        #load-more-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <img src="logo.svg" id="logo" alt="logo">
    <button class="win95-btn" onclick="toggleLogo(this)">とらを表示</button>
</header>

<div id="log-container"></div>
<p id="loading">Loading logs...</p>

<div id="load-more-container">
    <span id="load-more-btn" onclick="renderNextPage()">さらに読み込む</span>
</div>
